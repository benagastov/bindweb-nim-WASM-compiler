# =============================================================================
# nim.cfg -- configuration for the in-browser nim.wasm compiler.
#
# This file is shipped by the nim-config libpack, which the IDE mounts at
# /nim/config. It is INTENTIONALLY empty of switches.
#
# Every cross-compile setting lives on the compiler command line instead
# (SPEC section 5), because the command line is the single place both the
# IDE and the toolchain build agree on:
#
#   nim c --hints:off --os:linux --cpu:wasm32 --mm:arc --panics:on \
#     -d:useMalloc -d:wasm --noLinking:on --compileOnly:on \
#     --nimcache:/project/cache --path:/bindweb --path:/nim/lib \
#     -d:release /project/main.nim
#
# (--noMain is deliberately NOT passed: the pipeline keeps Nim's generated
# main and rewrites it to the 2-arg form wasi's crt1 expects — see
# web/src/nim-compiler.js and web/src/pipeline.js.)
#
# (The reference Bindweb config.nims agrees: its wasm block only repeats
# these same flags, plus clang/sysroot wiring that the in-browser pipeline
# performs in JavaScript instead.)
#
# The compiler runs correctly when this file is absent -- this pack is
# marked "required": false in the manifest. It exists so that settings
# which one day prove to belong in configuration rather than on the command
# line can ship as a libpack update, without rebuilding nim.wasm.
# =============================================================================
